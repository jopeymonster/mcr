[project]
name = 'mcr'
version = '0.1.0'
description = 'Mailchimp Marketing API read-only CLI prototype'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'requests',
]

[project.optional-dependencies]
dev = [
    'pytest',
    'ruff',
]

[project.scripts]
mcr = 'mcr.main:main'

[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
packages = ['mcr']

[tool.ruff]
line-length = 88
target-version = 'py311'

[tool.ruff.lint]
select = ['E', 'F', 'I']
ignore = ['E501']

[tool.ruff.lint.isort]
known-first-party = ['mcr']
combine-as-imports = true

[tool.ruff.format]
quote-style = 'double'
indent-style = 'space'

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
pythonpath = ['.']
